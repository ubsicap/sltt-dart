# Serverless Framework configuration for SLTT AWS Lambda deployment
service: sltt-backend

# No plugins needed - using manual build process

custom:
  mediaBucket: ${self:service}-media-worm-${aws:accountId}-${self:provider.stage}
  mediaCloudFrontPublicKey: ${ssm:/sltt/media/cloudfront/${self:provider.stage}/MEDIA_CLOUDFRONT_PUBLIC_KEY}
  mediaCloudFrontDomainByStage:
    dev: d22x8vmoxn2wwt.cloudfront.net
    tst: d2qw2gududo3yq.cloudfront.net
  mediaCloudFrontKeyPairIdByStage:
    dev: K2O627RQB773RQ
    tst: K2VWGFBHY47GFG

provider:
  name: aws
  runtime: provided.al2  # Custom runtime for Dart compiled binary
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  # Lambda function configuration
  timeout: 29
  memorySize: 512

  # Environment variables
  environment:
    STAGE: ${self:provider.stage}
    DYNAMODB_TABLE: ${self:service}-changes-states-${self:provider.stage}
    DYNAMODB_REGION: ${self:provider.region}
    MEDIA_BUCKET: ${self:custom.mediaBucket}
    MEDIA_CLOUDFRONT_DOMAIN: ${self:custom.mediaCloudFrontDomainByStage.${self:provider.stage}}
    MEDIA_CLOUDFRONT_KEY_PAIR_ID: ${self:custom.mediaCloudFrontKeyPairIdByStage.${self:provider.stage}}
    MEDIA_CLOUDFRONT_PRIVATE_KEY: ${ssm:/sltt/media/cloudfront/${self:provider.stage}/MEDIA_CLOUDFRONT_PRIVATE_KEY}

  # IAM permissions for DynamoDB
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
        - dynamodb:CreateTable
      Resource:
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/*"
    - Effect: Allow
      Action:
        - s3:AbortMultipartUpload
        - s3:CreateMultipartUpload
        - s3:GetObject
        - s3:HeadObject
        - s3:ListBucket
        - s3:ListBucketMultipartUploads
        - s3:ListMultipartUploadParts
        - s3:PutObject
        - s3:UploadPart
      Resource:
        - "arn:aws:s3:::${self:custom.mediaBucket}"
        - "arn:aws:s3:::${self:custom.mediaBucket}/*"

functions:
  # Main API handler for SLTT changes
  api:
    handler: bootstrap  # Lambda custom runtime expects 'bootstrap' executable
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

resources:
  Resources:
    # DynamoDB table for change log entries with improved schema
    ChangesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
          - AttributeName: gsi2pk
            AttributeType: S
          - AttributeName: gsi2sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: gsi2pk
                KeyType: HASH
              - AttributeName: gsi2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
    MediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.mediaBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        ObjectLockEnabled: true
        AccelerateConfiguration:
          AccelerationStatus: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: AbortIncompleteMultipartUploads
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 2
            - Id: IntelligentTieringTransition
              Status: Enabled
              Transitions:
                - StorageClass: INTELLIGENT_TIERING
                  TransitionInDays: 30
        ObjectLockConfiguration:
          ObjectLockEnabled: Enabled
          Rule:
            DefaultRetention:
              Mode: GOVERNANCE
              Years: 100
    MediaBucketOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-media-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    MediaCloudFrontCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-${self:provider.stage}-media-cache
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            CookiesConfig:
              CookieBehavior: none
            HeadersConfig:
              HeaderBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true
    MediaCloudFrontOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: ${self:service}-${self:provider.stage}-media-origin
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
    MediaCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service} media distribution (${self:provider.stage})
          HttpVersion: http2
          PriceClass: PriceClass_200
          Origins:
            - Id: MediaBucketOrigin
              DomainName: ${self:custom.mediaBucket}.s3.${self:provider.region}.amazonaws.com
              OriginAccessControlId: !Ref MediaBucketOriginAccessControl
              S3OriginConfig: {}
          DefaultCacheBehavior:
            TargetOriginId: MediaBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref MediaCloudFrontCachePolicy
            OriginRequestPolicyId: !Ref MediaCloudFrontOriginRequestPolicy
            TrustedKeyGroups:
              - !Ref MediaCloudFrontKeyGroup
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
    MediaCloudFrontPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          CallerReference: ${self:service}-${self:provider.stage}-media-public-key
          Name: ${self:service}-${self:provider.stage}-media-public-key
          EncodedKey: ${self:custom.mediaCloudFrontPublicKey}
          Comment: ${self:service} media public key (${self:provider.stage})
    MediaCloudFrontKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      Properties:
        KeyGroupConfig:
          Name: ${self:service}-${self:provider.stage}-media-key-group
          Items:
            - !Ref MediaCloudFrontPublicKey
    MediaBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:custom.mediaBucket}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::${self:custom.mediaBucket}/*
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCloudFrontDistribution}
  Outputs:
    MediaCloudFrontDomainName:
      Value: !GetAtt MediaCloudFrontDistribution.DomainName
    MediaCloudFrontDistributionId:
      Value: !Ref MediaCloudFrontDistribution

# Package configuration
package:
  individually: false
  include:
    - bootstrap  # Include our compiled Dart executable
  exclude:
    - '**'  # Exclude everything by default
    - '!bootstrap'  # Then explicitly include only bootstrap
