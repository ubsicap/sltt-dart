# Serverless Framework configuration for SLTT shared infrastructure
# This stack contains DynamoDB, S3, and CloudFront resources that are shared
# across multiple API deployments (potentially in different AWS accounts)
service: sltt-shared-infra

custom:
  # Fixed stage name - this infrastructure is shared across all API stages
  infraStage: prd

  # Resource naming without stage suffix since there's only one infrastructure
  dynamoDbTable: ${self:service}-changes-states
  mediaBucket: ${self:service}-media-worm-${aws:accountId}

  # CloudFront public key from SSM (setup required before deployment)
  mediaCloudFrontPublicKey: ${ssm:/sltt/media/cloudfront/${self:custom.infraStage}/MEDIA_CLOUDFRONT_PUBLIC_KEY}

  # SSM parameter prefix for exporting infrastructure values
  ssmPrefix: /sltt/infra/${self:custom.infraStage}

provider:
  name: aws
  region: us-east-1
  stage: ${self:custom.infraStage}

  # No Lambda functions in this stack, but provider section is required
  runtime: provided.al2

resources:
  Resources:
    # DynamoDB table for change log entries - shared across all API deployments
    ChangesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.dynamoDbTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
          - AttributeName: gsi2pk
            AttributeType: S
          - AttributeName: gsi2sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: gsi2pk
                KeyType: HASH
              - AttributeName: gsi2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Purpose
            Value: Shared infrastructure for SLTT API deployments

    # S3 bucket for media storage with WORM (Write Once Read Many) capabilities
    MediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.mediaBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        ObjectLockEnabled: true
        AccelerateConfiguration:
          AccelerationStatus: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: AbortIncompleteMultipartUploads
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 2
            - Id: IntelligentTieringTransition
              Status: Enabled
              Transitions:
                - StorageClass: INTELLIGENT_TIERING
                  TransitionInDays: 30
        ObjectLockConfiguration:
          ObjectLockEnabled: Enabled
          Rule:
            DefaultRetention:
              Mode: GOVERNANCE
              Years: 100

    # CloudFront Origin Access Control for S3
    MediaBucketOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-media-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # CloudFront cache policy for media content
    MediaCloudFrontCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-media-cache
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            CookiesConfig:
              CookieBehavior: none
            HeadersConfig:
              HeaderBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true

    # CloudFront origin request policy
    MediaCloudFrontOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: ${self:service}-media-origin
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

    # CloudFront distribution for media delivery
    MediaCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service} media distribution (shared)
          HttpVersion: http2
          PriceClass: PriceClass_200
          Origins:
            - Id: MediaBucketOrigin
              DomainName: ${self:custom.mediaBucket}.s3.${self:provider.region}.amazonaws.com
              OriginAccessControlId: !Ref MediaBucketOriginAccessControl
              S3OriginConfig: {}
          DefaultCacheBehavior:
            TargetOriginId: MediaBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref MediaCloudFrontCachePolicy
            OriginRequestPolicyId: !Ref MediaCloudFrontOriginRequestPolicy
            TrustedKeyGroups:
              - !Ref MediaCloudFrontKeyGroup
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

    # CloudFront public key for signed URLs
    MediaCloudFrontPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          CallerReference: ${self:service}-media-public-key
          Name: ${self:service}-media-public-key
          EncodedKey: ${self:custom.mediaCloudFrontPublicKey}
          Comment: ${self:service} media public key (shared)

    # CloudFront key group
    MediaCloudFrontKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      Properties:
        KeyGroupConfig:
          Name: ${self:service}-media-key-group
          Items:
            - !Ref MediaCloudFrontPublicKey

    # S3 bucket policy to allow CloudFront and secondary access
    MediaBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:custom.mediaBucket}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::${self:custom.mediaBucket}/*
              Condition:
                StringEquals:
                  aws:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCloudFrontDistribution}
            # Allow secondary deployments to read/write objects
            - Sid: AllowSecondaryRead
              Effect: Allow
              Principal:
                AWS: '*'
              Action:
                - s3:GetObject
              Resource:
                - !Sub '${MediaBucket.Arn}/*'
              Condition:
                ArnLike:
                  'aws:PrincipalArn':
                    # Direct role ARN from same account
                    - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sltt-secondary-infra-*-${AWS::Region}-lambdaRole'
                    # Assumed-role ARN from same account
                    - !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sltt-secondary-infra-*-${AWS::Region}-lambdaRole/*'
                    # Cross-account: secondary account (sltt-epyle dev/tst)
                    - 'arn:aws:sts::662482841188:assumed-role/sltt-secondary-infra-*-us-east-1-lambdaRole/*'
            - Sid: AllowSecondaryWrite
              Effect: Allow
              Principal:
                AWS: '*'
              Action:
                - s3:PutObject
              Resource:
                - !Sub '${MediaBucket.Arn}/*'
              Condition:
                ArnLike:
                  'aws:PrincipalArn':
                    # Direct role ARN from same account
                    - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sltt-secondary-infra-*-${AWS::Region}-lambdaRole'
                    # Assumed-role ARN from same account
                    - !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sltt-secondary-infra-*-${AWS::Region}-lambdaRole/*'
                    # Cross-account: secondary account (sltt-epyle dev/tst)
                    - 'arn:aws:sts::662482841188:assumed-role/sltt-secondary-infra-*-us-east-1-lambdaRole/*'
            - Sid: AllowSecondaryListBucket
              Effect: Allow
              Principal:
                AWS: '*'
              Action:
                - s3:ListBucket
              Resource:
                - !GetAtt MediaBucket.Arn
              Condition:
                ArnLike:
                  'aws:PrincipalArn':
                    # Direct role ARN from same account
                    - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sltt-secondary-infra-*-${AWS::Region}-lambdaRole'
                    # Assumed-role ARN from same account
                    - !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sltt-secondary-infra-*-${AWS::Region}-lambdaRole/*'
                    # Cross-account: secondary account (sltt-epyle dev/tst)
                    - 'arn:aws:sts::662482841188:assumed-role/sltt-secondary-infra-*-us-east-1-lambdaRole/*'

    # IAM policy to allow secondary deployments to read SSM parameters
    # This is attached to the CrossAccountAccessRole to enable parameter reads
    SsmParameterAccessPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: ${self:service}-ssm-parameter-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.ssmPrefix}/*'
        Roles:
          - !Ref CrossAccountAccessRole

    # SSM Parameters to store infrastructure values for cross-account access
    DynamoDbTableNameParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/dynamodb/table-name
        Type: String
        Tier: Advanced
        Value: !Ref ChangesTable
        Description: DynamoDB table name for SLTT changes

    DynamoDbTableArnParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/dynamodb/table-arn
        Type: String
        Tier: Advanced
        Value: !GetAtt ChangesTable.Arn
        Description: DynamoDB table ARN for SLTT changes

    MediaBucketNameParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/s3/bucket-name
        Type: String
        Tier: Advanced
        Value: !Ref MediaBucket
        Description: S3 media bucket name

    MediaBucketArnParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/s3/bucket-arn
        Type: String
        Tier: Advanced
        Value: !GetAtt MediaBucket.Arn
        Description: S3 media bucket ARN

    MediaCloudFrontDomainParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cloudfront/domain
        Type: String
        Tier: Advanced
        Value: !GetAtt MediaCloudFrontDistribution.DomainName
        Description: CloudFront distribution domain name

    MediaCloudFrontKeyPairIdParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cloudfront/keypair-id
        Type: String
        Tier: Advanced
        Value: !Ref MediaCloudFrontPublicKey
        Description: CloudFront key pair ID for signed URLs

    MediaCloudFrontPrivateKeyParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cloudfront/private-key
        Type: String
        Tier: Advanced
        Value: ${ssm:/sltt/media/cloudfront/${self:custom.infraStage}/MEDIA_CLOUDFRONT_PRIVATE_KEY}
        Description: CloudFront private key for signed URLs (copied from source parameter)

    InfraRegionParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/region
        Type: String
        Tier: Advanced
        Value: ${self:provider.region}
        Description: AWS region where infrastructure is deployed

    InfraAccountIdParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/account-id
        Type: String
        Tier: Advanced
        Value: !Ref AWS::AccountId
        Description: AWS account ID where infrastructure is deployed

    # IAM role for cross-account access (secondary accounts can assume this)
    CrossAccountAccessRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-cross-account-access
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            # Allow same account to assume with ExternalId
            - Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  'sts:ExternalId': 'sltt-cross-account-access'
            # Allow target account (662482841188) to assume with ExternalId
            - Effect: Allow
              Principal:
                AWS: 'arn:aws:iam::662482841188:root'
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  'sts:ExternalId': 'sltt-cross-account-access'
        Policies:
          - PolicyName: DynamoDBAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:BatchGetItem
                    - dynamodb:BatchWriteItem
                    - dynamodb:DescribeTable
                  Resource:
                    - !GetAtt ChangesTable.Arn
                    - !Sub '${ChangesTable.Arn}/index/*'
          - PolicyName: S3Access
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:AbortMultipartUpload
                    - s3:CreateMultipartUpload
                    - s3:GetObject
                    - s3:HeadObject
                    - s3:ListBucket
                    - s3:ListBucketMultipartUploads
                    - s3:ListMultipartUploadParts
                    - s3:PutObject
                    - s3:UploadPart
                  Resource:
                    - !GetAtt MediaBucket.Arn
                    - !Sub '${MediaBucket.Arn}/*'

    # Store cross-account role ARN in SSM for secondary stacks to reference
    SsmCrossAccountRoleArn:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cross-account-role-arn
        Type: String
        Tier: Advanced
        Value: !GetAtt CrossAccountAccessRole.Arn
        Description: ARN of role that secondary accounts can assume for cross-account access

  Outputs:
    # Export infrastructure values
    DynamoDbTableName:
      Description: DynamoDB table name
      Value: !Ref ChangesTable
      Export:
        Name: ${self:service}-dynamodb-table-name

    DynamoDbTableArn:
      Description: DynamoDB table ARN
      Value: !GetAtt ChangesTable.Arn
      Export:
        Name: ${self:service}-dynamodb-table-arn

    MediaBucketName:
      Description: S3 media bucket name
      Value: !Ref MediaBucket
      Export:
        Name: ${self:service}-media-bucket-name

    MediaBucketArn:
      Description: S3 media bucket ARN
      Value: !GetAtt MediaBucket.Arn
      Export:
        Name: ${self:service}-media-bucket-arn

    MediaCloudFrontDomainName:
      Description: CloudFront distribution domain name
      Value: !GetAtt MediaCloudFrontDistribution.DomainName
      Export:
        Name: ${self:service}-cloudfront-domain

    MediaCloudFrontDistributionId:
      Description: CloudFront distribution ID
      Value: !Ref MediaCloudFrontDistribution
      Export:
        Name: ${self:service}-cloudfront-distribution-id

    MediaCloudFrontKeyPairId:
      Description: CloudFront key pair ID
      Value: !Ref MediaCloudFrontPublicKey
      Export:
        Name: ${self:service}-cloudfront-keypair-id

    CrossAccountAccessRoleArn:
      Description: ARN of IAM role for cross-account access
      Value: !GetAtt CrossAccountAccessRole.Arn
      Export:
        Name: ${self:service}-cross-account-role-arn

    # Post-deployment instructions
    SsmParametersSetupCommand:
      Description: Run this command after deployment to set SSM parameters needed by secondary deployments
      Value: npm run setup:ssm-parameters

    SsmParametersUsedBySecondary:
      Description: SSM parameters that secondary deployments will reference (ensure cross-account access is granted)
      Value: |
        /sltt/infra/prd/dynamodb/table-name
        /sltt/infra/prd/dynamodb/table-arn
        /sltt/infra/prd/s3/bucket-name
        /sltt/infra/prd/s3/bucket-arn
        /sltt/infra/prd/cloudfront/domain
        /sltt/infra/prd/cloudfront/keypair-id
        /sltt/infra/prd/cloudfront/private-key
        /sltt/infra/prd/region
