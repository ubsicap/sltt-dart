# Serverless Framework configuration for SLTT shared infrastructure
# This stack contains ONLY resources that must be a single, cross-account
# source of truth pinned to the production account:
#   - S3 media bucket (Object Lock + if-match semantics require one bucket)
#   - CloudFront distribution/policies/keys fronting that bucket
#
# DynamoDB tables live in serverless-data-infra.yml (deployed per account/stage).
# SES is deployed and verified locally per account (see serverless-secondary-infra.yml) -
# this stack has no SES resources and secondary accounts never send cross-account email.
service: sltt-${self:custom.slttStackVersion}-shared-infra

custom:
  # SLTT infrastructure version used for resource naming and parameter prefixes
  slttStackVersion: v2

  # Fixed stage name - this infrastructure is shared across all API stages
  infraStage: prd

  # Resource naming without stage suffix since there's only one infrastructure
  mediaBucket: ${self:service}-media-worm-${aws:accountId}

  # CloudFront public key from SSM (setup required before deployment)
  mediaCloudFrontPublicKey: ${ssm:/sltt/media/cloudfront/${self:custom.infraStage}/MEDIA_CLOUDFRONT_PUBLIC_KEY}

  # SSM parameter prefix for exporting infrastructure values
  ssmPrefix: /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}

provider:
  name: aws
  region: us-east-1
  stage: ${self:custom.infraStage}

  # No Lambda functions in this stack, but provider section is required
  runtime: provided.al2

resources:
  Resources:
    # S3 bucket for media storage with WORM (Write Once Read Many) capabilities
    MediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.mediaBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        ObjectLockEnabled: true
        AccelerateConfiguration:
          AccelerationStatus: Enabled
        # Cross-account writers (secondary accounts) never send ACLs and rely
        # entirely on the bucket policy below for access, so the bucket - not
        # the writing account - should own every object. Also required for
        # the if-match/object-lock guarantees to apply consistently regardless
        # of which account's Lambda wrote the object.
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        LifecycleConfiguration:
          Rules:
            - Id: AbortIncompleteMultipartUploads
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 2
            - Id: IntelligentTieringTransition
              Status: Enabled
              Transitions:
                - StorageClass: INTELLIGENT_TIERING
                  TransitionInDays: 30
        ObjectLockConfiguration:
          ObjectLockEnabled: Enabled
          Rule:
            DefaultRetention:
              Mode: GOVERNANCE
              Years: 100

    # CloudFront Origin Access Control for S3
    MediaBucketOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-media-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # CloudFront cache policy for media content
    MediaCloudFrontCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: ${self:service}-media-cache
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            CookiesConfig:
              CookieBehavior: none
            HeadersConfig:
              HeaderBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: none
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true

    # CloudFront origin request policy
    MediaCloudFrontOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: ${self:service}-media-origin
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

    # CloudFront distribution for media delivery
    MediaCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service} media distribution (shared)
          HttpVersion: http2
          PriceClass: PriceClass_200
          Origins:
            - Id: MediaBucketOrigin
              DomainName: ${self:custom.mediaBucket}.s3.${self:provider.region}.amazonaws.com
              OriginAccessControlId: !Ref MediaBucketOriginAccessControl
              S3OriginConfig: {}
          DefaultCacheBehavior:
            TargetOriginId: MediaBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref MediaCloudFrontCachePolicy
            OriginRequestPolicyId: !Ref MediaCloudFrontOriginRequestPolicy
            TrustedKeyGroups:
              - !Ref MediaCloudFrontKeyGroup
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

    # CloudFront public key for signed URLs
    MediaCloudFrontPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          CallerReference: ${self:service}-media-public-key
          Name: ${self:service}-media-public-key
          EncodedKey: ${self:custom.mediaCloudFrontPublicKey}
          Comment: ${self:service} media public key (shared)

    # CloudFront key group
    MediaCloudFrontKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      Properties:
        KeyGroupConfig:
          Name: ${self:service}-media-key-group
          Items:
            - !Ref MediaCloudFrontPublicKey

    # S3 bucket policy. This is the ONLY thing that grants secondary accounts
    # access - they call S3 directly with their own Lambda execution role
    # credentials; there is no cross-account role to assume. If you add a new
    # secondary account/environment, add its role ARN pattern here and
    # redeploy this stack.
    MediaBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:custom.mediaBucket}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::${self:custom.mediaBucket}/*
              Condition:
                StringEquals:
                  aws:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCloudFrontDistribution}
            # Allow secondary deployments to read/write objects directly with
            # their own Lambda execution role - no AssumeRole involved.
            - Sid: AllowSecondaryRead
              Effect: Allow
              Principal:
                AWS: '*'
              Action:
                - s3:GetObject
              Resource:
                - !Sub '${MediaBucket.Arn}/*'
              Condition:
                ArnLike:
                  'aws:PrincipalArn':
                    # Direct role ARN from same account
                    - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sltt-v2-secondary-infra-*-${AWS::Region}-lambdaRole'
                    # Assumed-role ARN from same account
                    - !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sltt-v2-secondary-infra-*-${AWS::Region}-lambdaRole/*'
                    # Cross-account: secondary account (sltt-epyle dev/tst)
                    - 'arn:aws:sts::662482841188:assumed-role/sltt-v2-secondary-infra-*-us-east-1-lambdaRole/*'
            - Sid: AllowSecondaryWrite
              Effect: Allow
              Principal:
                AWS: '*'
              Action:
                - s3:PutObject
              Resource:
                - !Sub '${MediaBucket.Arn}/*'
              Condition:
                ArnLike:
                  'aws:PrincipalArn':
                    - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sltt-v2-secondary-infra-*-${AWS::Region}-lambdaRole'
                    - !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sltt-v2-secondary-infra-*-${AWS::Region}-lambdaRole/*'
                    - 'arn:aws:sts::662482841188:assumed-role/sltt-v2-secondary-infra-*-us-east-1-lambdaRole/*'
                StringEquals:
                  's3:if-none-match': '*'
            - Sid: AllowSecondaryListBucket
              Effect: Allow
              Principal:
                AWS: '*'
              Action:
                - s3:ListBucket
              Resource:
                - !GetAtt MediaBucket.Arn
              Condition:
                ArnLike:
                  'aws:PrincipalArn':
                    - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sltt-v2-secondary-infra-*-${AWS::Region}-lambdaRole'
                    - !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sltt-v2-secondary-infra-*-${AWS::Region}-lambdaRole/*'
                    - 'arn:aws:sts::662482841188:assumed-role/sltt-v2-secondary-infra-*-us-east-1-lambdaRole/*'
            # Allow DynamoDB service to export table snapshots to S3, in case
            # the data-infra export/import workflow copies snapshots through
            # this bucket instead of a per-account one.
            - Sid: AllowDynamoDBExport
              Effect: Allow
              Principal:
                Service: dynamodb.amazonaws.com
              Action:
                - s3:PutObject
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                - arn:aws:s3:::${self:custom.mediaBucket}
                - arn:aws:s3:::${self:custom.mediaBucket}/*

    # SSM Parameters to expose infrastructure values for cross-account reads.
    # These parameters must have a resource policy granting secondary accounts
    # GetParameter/GetParameters access (see npm run setup:ssm-parameters) -
    # that mechanism is unrelated to IAM roles and is unchanged by this split.
    MediaBucketNameParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/s3/bucket-name
        Type: String
        Tier: Advanced
        Value: !Ref MediaBucket
        Description: S3 media bucket name

    MediaBucketArnParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/s3/bucket-arn
        Type: String
        Tier: Advanced
        Value: !GetAtt MediaBucket.Arn
        Description: S3 media bucket ARN

    MediaCloudFrontDomainParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cloudfront/domain
        Type: String
        Tier: Advanced
        Value: !GetAtt MediaCloudFrontDistribution.DomainName
        Description: CloudFront distribution domain name

    MediaCloudFrontKeyPairIdParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cloudfront/keypair-id
        Type: String
        Tier: Advanced
        Value: !Ref MediaCloudFrontPublicKey
        Description: CloudFront key pair ID for signed URLs

    MediaCloudFrontPrivateKeyParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/cloudfront/private-key
        Type: String
        Tier: Advanced
        Value: ${ssm:/sltt/media/cloudfront/${self:custom.infraStage}/MEDIA_CLOUDFRONT_PRIVATE_KEY}
        Description: CloudFront private key for signed URLs (copied from source parameter)

    InfraRegionParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/region
        Type: String
        Tier: Advanced
        Value: ${self:provider.region}
        Description: AWS region where shared media infrastructure is deployed

    InfraAccountIdParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: ${self:custom.ssmPrefix}/account-id
        Type: String
        Tier: Advanced
        Value: !Ref AWS::AccountId
        Description: AWS account ID where shared media infrastructure is deployed

  Outputs:
    MediaBucketName:
      Description: S3 media bucket name
      Value: !Ref MediaBucket
      Export:
        Name: ${self:service}-media-bucket-name

    MediaBucketArn:
      Description: S3 media bucket ARN
      Value: !GetAtt MediaBucket.Arn
      Export:
        Name: ${self:service}-media-bucket-arn

    MediaCloudFrontDomainName:
      Description: CloudFront distribution domain name
      Value: !GetAtt MediaCloudFrontDistribution.DomainName
      Export:
        Name: ${self:service}-cloudfront-domain

    MediaCloudFrontDistributionId:
      Description: CloudFront distribution ID
      Value: !Ref MediaCloudFrontDistribution
      Export:
        Name: ${self:service}-cloudfront-distribution-id

    MediaCloudFrontKeyPairId:
      Description: CloudFront key pair ID
      Value: !Ref MediaCloudFrontPublicKey
      Export:
        Name: ${self:service}-cloudfront-keypair-id

    # Post-deployment instructions
    SsmParametersSetupCommand:
      Description: Run this command after deployment to grant secondary accounts read access to the SSM parameters below
      Value: npm run setup:ssm-parameters

    SsmParametersUsedBySecondary:
      Description: SSM parameters that secondary deployments read cross-account (S3/CloudFront only - DynamoDB values now come from each account's own data-infra stack)
      Value: |
        /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}/s3/bucket-name
        /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}/s3/bucket-arn
        /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}/cloudfront/domain
        /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}/cloudfront/keypair-id
        /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}/cloudfront/private-key
        /sltt/${self:custom.slttStackVersion}/${self:custom.infraStage}/region
