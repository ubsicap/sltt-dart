# Serverless Framework configuration for SLTT secondary infrastructure
# This stack contains API functions and references shared infrastructure
# resources (DynamoDB, S3, CloudFront) from the shared infra account.
service: sltt-${self:custom.slttStackVersion}-secondary-infra

custom:
  # SLTT infrastructure version used for resource naming and parameter prefixes
  slttStackVersion: v1

  # Shared infrastructure stage (fixed to prd by default)
  sharedInfraStage: ${opt:sharedInfraStage, 'prd'}
  # Shared infra account (source of SSM params)
  sharedInfraAccountId: ${opt:sharedInfraAccountId, '379334555674'}

  # SSM parameter prefix for shared infrastructure values
  sharedInfraSsmPrefix: /sltt/${self:custom.slttStackVersion}/${self:custom.sharedInfraStage}
  sharedInfraArnPath: arn:aws:ssm:${self:provider.region}:${self:custom.sharedInfraAccountId}:parameter${self:custom.sharedInfraSsmPrefix}

  # Shared infrastructure values from SSM (can be cross-account via SSM resource policy)
  dynamoDbTable: ${ssm:${self:custom.sharedInfraArnPath}/dynamodb/table-name}
  dynamoDbTableArn: ${ssm:${self:custom.sharedInfraArnPath}/dynamodb/table-arn}
  authTable: ${ssm:${self:custom.sharedInfraArnPath}/auth/table-name}
  authTableArn: ${ssm:${self:custom.sharedInfraArnPath}/auth/table-arn}
  mediaBucket: ${ssm:${self:custom.sharedInfraArnPath}/s3/bucket-name}
  mediaBucketArn: ${ssm:${self:custom.sharedInfraArnPath}/s3/bucket-arn}
  mediaCloudFrontDomain: ${ssm:${self:custom.sharedInfraArnPath}/cloudfront/domain}
  mediaCloudFrontKeyPairId: ${ssm:${self:custom.sharedInfraArnPath}/cloudfront/keypair-id}
  mediaCloudFrontPrivateKey: ${ssm:${self:custom.sharedInfraArnPath}/cloudfront/private-key}
  sharedInfraRegion: ${ssm:${self:custom.sharedInfraArnPath}/region}

provider:
  name: aws
  runtime: provided.al2  # Custom runtime for Dart compiled binary
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  # Lambda function configuration
  timeout: 29
  memorySize: 512

  # Environment variables
  environment:
    STAGE: ${self:provider.stage}
    GIT_SHORT_CHANGESET: ${env:GIT_SHORT_CHANGESET, ''}
    GIT_DIRTY_FLAG: ${env:GIT_DIRTY_FLAG, ''}
    DYNAMODB_TABLE: ${self:custom.dynamoDbTable}
    DYNAMODB_TABLE_ARN: ${self:custom.dynamoDbTableArn}
    AUTH_TABLE: ${self:custom.authTable}
    AUTH_TABLE_ARN: ${self:custom.authTableArn}
    AUTH_JWT_SECRET: ${ssm:/sltt/auth/${self:provider.stage}/jwt-secret, ''}
    AUTH_VERIFICATION_CODE_SECRET: ${ssm:/sltt/auth/${self:provider.stage}/verification-code-secret, ''}
    AUTH_ACCESS_TOKEN_TTL_MINUTES: ${ssm:/sltt/auth/${self:provider.stage}/access-token-ttl-minutes, '60'}
    AUTH_REFRESH_TOKEN_TTL_DAYS: ${ssm:/sltt/auth/${self:provider.stage}/refresh-token-ttl-days, '30'}
    AUTH_EMAIL_MODE: ${ssm:/sltt/auth/${self:provider.stage}/email-mode, 'ses'}
    AUTH_SES_FROM_EMAIL: ${ssm:/sltt/auth/${self:provider.stage}/ses-from-email, 'no-reply@sltt-bible.net'}
    DYNAMODB_REGION: ${self:custom.sharedInfraRegion}
    SHARED_INFRA_ASSUME_ROLE_ARN: ${ssm:${self:custom.sharedInfraArnPath}/cross-account-role-arn}
    ASSUME_ROLE_SESSION_NAME: sltt-v1-secondary-infra-${self:provider.stage}
    MEDIA_BUCKET: ${self:custom.mediaBucket}
    MEDIA_CLOUDFRONT_DOMAIN: ${self:custom.mediaCloudFrontDomain}
    MEDIA_CLOUDFRONT_KEY_PAIR_ID: ${self:custom.mediaCloudFrontKeyPairId}
    MEDIA_CLOUDFRONT_PRIVATE_KEY: ${self:custom.mediaCloudFrontPrivateKey}
    SLTT_LOG_LEVEL: INFO

  # IAM permissions for shared DynamoDB + S3 resources
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - ${self:custom.dynamoDbTableArn}
        - ${self:custom.dynamoDbTableArn}/index/*
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - ${self:custom.authTableArn}
    - Effect: Allow
      Action:
        - dynamodb:ExportTableToPointInTime
      Resource:
        - ${self:custom.dynamoDbTableArn}
    - Effect: Allow
      Action:
        - dynamodb:DescribeExport
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${self:custom.sharedInfraAccountId}:table/${self:custom.dynamoDbTable}/export/*
    - Effect: Allow
      Action:
        - dynamodb:ListExports
      Resource: '*'
    - Effect: Allow
      Action:
        - s3:AbortMultipartUpload
        - s3:CreateMultipartUpload
        - s3:GetObject
        - s3:HeadObject
        - s3:ListBucket
        - s3:ListBucketMultipartUploads
        - s3:ListMultipartUploadParts
        - s3:PutObject
        - s3:UploadPart
      Resource:
        - ${self:custom.mediaBucketArn}
        - ${self:custom.mediaBucketArn}/*
    - Effect: Allow
      Action:
        - ses:SendEmail
      Resource: '*'
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
      Resource:
        - ${self:custom.sharedInfraArnPath}/*
        - arn:aws:ssm:${self:provider.region}:*:parameter/sltt/auth/${self:provider.stage}/*
    - Effect: Allow
      Action:
        - sts:AssumeRole
      Resource:
        - ${ssm:${self:custom.sharedInfraArnPath}/cross-account-role-arn}

functions:
  # Main API handler for SLTT changes
  api:
    handler: bootstrap  # Lambda custom runtime expects 'bootstrap' executable
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

resources:
  Resources:
    AuthApiWebAcl:
      Type: AWS::WAFv2::WebACL
      Properties:
        Name: sltt-v1-secondary-infra-${self:provider.stage}-auth-api
        Scope: REGIONAL
        DefaultAction:
          Allow: {}
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: sltt-v1-secondary-infra-${self:provider.stage}-auth-api
          SampledRequestsEnabled: true
        Rules:
          - Name: auth-api-rate-limit-100-per-5-min
            Priority: 0
            Action:
              Block: {}
            Statement:
              RateBasedStatement:
                AggregateKeyType: IP
                Limit: 100
                ScopeDownStatement:
                  ByteMatchStatement:
                    FieldToMatch:
                      UriPath: {}
                    PositionalConstraint: STARTS_WITH
                    SearchString: /api/auth/
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: auth-api-rate-limit-100-per-5-min
              SampledRequestsEnabled: true

    AuthApiWebAclAssociation:
      Type: AWS::WAFv2::WebACLAssociation
      Properties:
        ResourceArn:
          Fn::Join:
            - ''
            - - 'arn:aws:apigateway:'
              - Ref: AWS::Region
              - '::/restapis/'
              - Ref: ApiGatewayRestApi
              - '/stages/'
              - ${self:provider.stage}
        WebACLArn:
          Fn::GetAtt:
            - AuthApiWebAcl
            - Arn

# Package configuration
package:
  individually: false
  include:
    - bootstrap  # Include our compiled Dart executable
  exclude:
    - '**'  # Exclude everything by default
    - '!bootstrap'  # Then explicitly include only bootstrap
