# Serverless Framework configuration for SLTT secondary infrastructure
# This stack contains API functions and references:
#   - DynamoDB tables from serverless-data-infra.yml, deployed in THIS SAME
#     account/stage - read via local SSM, plain same-account IAM, no
#     AssumeRole.
#   - S3/CloudFront from serverless-shared-infra.yml, pinned to the prd
#     account - read via cross-account SSM parameter reads, and S3 objects
#     are written directly with this stack's own Lambda execution role
#     (the shared bucket policy trusts that role's ARN pattern). No
#     AssumeRole here either.
#   - SES, configured and verified LOCALLY in this account. Email is never
#     sent cross-account; dev/test environments read verification codes etc.
#     from this account's own CloudWatch Logs instead of real delivery.
service: sltt-${self:custom.slttStackVersion}-secondary-infra

custom:
  # SLTT infrastructure version used for resource naming and parameter prefixes
  slttStackVersion: v2

  # --- Media (shared-infra) lookup: cross-account, fixed to prd -----------
  mediaInfraStage: ${opt:mediaInfraStage, 'prd'}
  mediaInfraAccountId: ${opt:mediaInfraAccountId, '379334555674'}
  mediaInfraSsmPrefix: /sltt/${self:custom.slttStackVersion}/${self:custom.mediaInfraStage}
  mediaInfraArnPath: arn:aws:ssm:${self:provider.region}:${self:custom.mediaInfraAccountId}:parameter${self:custom.mediaInfraSsmPrefix}

  mediaBucket: ${ssm:${self:custom.mediaInfraArnPath}/s3/bucket-name}
  mediaBucketArn: ${ssm:${self:custom.mediaInfraArnPath}/s3/bucket-arn}
  mediaCloudFrontDomain: ${ssm:${self:custom.mediaInfraArnPath}/cloudfront/domain}
  mediaCloudFrontKeyPairId: ${ssm:${self:custom.mediaInfraArnPath}/cloudfront/keypair-id}
  mediaCloudFrontPrivateKey: ${ssm:${self:custom.mediaInfraArnPath}/cloudfront/private-key}
  mediaInfraRegion: ${ssm:${self:custom.mediaInfraArnPath}/region}

  # --- Data (data-infra) lookup: LOCAL, same account/stage as this stack ---
  # No account id needed - this is a same-account SSM read.
  dataInfraSsmPrefix: /sltt/${self:custom.slttStackVersion}/${self:provider.stage}

  dynamoDbTable: ${ssm:${self:custom.dataInfraSsmPrefix}/dynamodb/table-name}
  dynamoDbTableArn: ${ssm:${self:custom.dataInfraSsmPrefix}/dynamodb/table-arn}
  authTable: ${ssm:${self:custom.dataInfraSsmPrefix}/auth/table-name}
  authTableArn: ${ssm:${self:custom.dataInfraSsmPrefix}/auth/table-arn}

  # Table backing websocket connections + their domain/entity subscriptions
  websocketConnectionsTable: sltt-${self:custom.slttStackVersion}-ws-connections-${self:provider.stage}

  # Fan-out topic: publishers (like the api function) don't need to know who's
  # listening. Websocket notify is one subscriber today; a future mobile push
  # notifier subscribes to the same topic without touching the publisher.
  domainChangeTopicName: sltt-${self:custom.slttStackVersion}-domain-change-${self:provider.stage}

provider:
  name: aws
  runtime: provided.al2  # Custom runtime for Dart compiled binary
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  # Lambda function configuration
  timeout: 29
  memorySize: 512

  # Route incoming websocket messages by their "action" field,
  # e.g. {"action": "subscribe", "domainType": "...", "domainId": "...", "entityType": "..."}
  websocketsApiRouteSelectionExpression: $request.body.action

  # Environment variables
  environment:
    STAGE: ${self:provider.stage}
    SLTT_DEBUG: ${env:SLTT_DEBUG, 'true'}
    GIT_SHORT_CHANGESET: ${env:GIT_SHORT_CHANGESET, ''}
    GIT_DIRTY_FLAG: ${env:GIT_DIRTY_FLAG, ''}
    DYNAMODB_TABLE: ${self:custom.dynamoDbTable}
    DYNAMODB_TABLE_ARN: ${self:custom.dynamoDbTableArn}
    AUTH_TABLE: ${self:custom.authTable}
    AUTH_TABLE_ARN: ${self:custom.authTableArn}
    AUTH_JWT_SECRET: ${ssm:/sltt/auth/${self:provider.stage}/jwt-secret, ''}
    AUTH_VERIFICATION_CODE_SECRET: ${ssm:/sltt/auth/${self:provider.stage}/verification-code-secret, ''}
    AUTH_ACCESS_TOKEN_TTL_MINUTES: ${ssm:/sltt/auth/${self:provider.stage}/access-token-ttl-minutes, '60'}
    AUTH_REFRESH_TOKEN_TTL_DAYS: ${ssm:/sltt/auth/${self:provider.stage}/refresh-token-ttl-days, '30'}
    AUTH_EMAIL_MODE: ${ssm:/sltt/auth/${self:provider.stage}/email-mode, 'ses'}
    AUTH_SES_FROM_EMAIL: ${ssm:/sltt/auth/${self:provider.stage}/ses-from-email, 'no-reply@sltt-bible.net'}
    # DynamoDB is now LOCAL - same region as this stack's own deployment.
    DYNAMODB_REGION: ${self:provider.region}
    # S3/CloudFront live in the shared media account, which may not be the
    # same region as this stack. Kept distinct from DYNAMODB_REGION/the
    # Lambda's own execution region on purpose - do not collapse these.
    MEDIA_BUCKET: ${self:custom.mediaBucket}
    MEDIA_BUCKET_REGION: ${self:custom.mediaInfraRegion}
    MEDIA_CLOUDFRONT_DOMAIN: ${self:custom.mediaCloudFrontDomain}
    MEDIA_CLOUDFRONT_KEY_PAIR_ID: ${self:custom.mediaCloudFrontKeyPairId}
    MEDIA_CLOUDFRONT_PRIVATE_KEY: ${self:custom.mediaCloudFrontPrivateKey}
    SLTT_LOG_LEVEL: INFO
    WEBSOCKET_CONNECTIONS_TABLE: ${self:custom.websocketConnectionsTable}
    WEBSOCKET_CONNECTIONS_TABLE_ARN: !GetAtt WebsocketConnectionsTable.Arn
    # wsNotify (SNS subscriber) uses this to call the API Gateway Management API
    # and push to open connections; api itself only publishes to SNS below.
    WEBSOCKET_API_ENDPOINT:
      Fn::Join:
        - ''
        - - 'https://'
          - !Ref WebsocketsApi
          - '.execute-api.'
          - ${self:provider.region}
          - '.amazonaws.com/'
          - ${self:provider.stage}
    DOMAIN_CHANGE_TOPIC_ARN: !Ref DomainChangeTopic

  # IAM permissions. NOTE: no sts:AssumeRole statement anywhere in this stack.
  # DynamoDB tables are same-account (plain resource ARNs below). S3 access
  # to the cross-account media bucket is granted by that bucket's own policy
  # trusting this role's ARN pattern directly - nothing to assume here either.
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - ${self:custom.dynamoDbTableArn}
        - ${self:custom.dynamoDbTableArn}/index/*
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - ${self:custom.authTableArn}
        - ${self:custom.authTableArn}/index/*
    - Effect: Allow
      Action:
        - dynamodb:ExportTableToPointInTime
      Resource:
        - ${self:custom.dynamoDbTableArn}
        - ${self:custom.authTableArn}
    - Effect: Allow
      Action:
        - dynamodb:ListExports
        - dynamodb:DescribeExport
      Resource: '*'
    - Effect: Allow
      Action:
        - s3:AbortMultipartUpload
        - s3:CreateMultipartUpload
        - s3:GetObject
        - s3:HeadObject
        - s3:ListBucket
        - s3:ListBucketMultipartUploads
        - s3:ListMultipartUploadParts
        - s3:PutObject
        - s3:UploadPart
      Resource:
        - ${self:custom.mediaBucketArn}
        - ${self:custom.mediaBucketArn}/*
    - Effect: Allow
      # SES is local to this account - Resource '*' scopes to identities
      # verified in THIS account only, which is the point (see custom.
      # mediaInfraStage comment above: email is never sent cross-account).
      Action:
        - ses:SendEmail
      Resource: '*'
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
      Resource:
        # Local data-infra + auth secrets (same account)
        - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.dataInfraSsmPrefix}/*
        - arn:aws:ssm:${self:provider.region}:*:parameter/sltt/auth/${self:provider.stage}/*
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchWriteItem
      Resource:
        - !GetAtt WebsocketConnectionsTable.Arn
        - !Join ['', [!GetAtt WebsocketConnectionsTable.Arn, '/index/*']]
    - Effect: Allow
      # Lets any function push messages to, or detect stale, open websocket connections
      Action:
        - execute-api:ManageConnections
      Resource:
        - !Join
          - ''
          - - 'arn:aws:execute-api:'
            - ${self:provider.region}
            - ':'
            - !Ref AWS::AccountId
            - ':'
            - !Ref WebsocketsApi
            - '/*'
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - !Ref DomainChangeTopic

functions:
  # Main API handler for SLTT changes. On any mutation, publishes a
  # {domainType, domainId, entityType, ...} event to DomainChangeTopic —
  # it does not talk to websocket connections directly.
  api:
    handler: bootstrap  # Lambda custom runtime expects 'bootstrap' executable
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

  # Validates the bearer token on the websocket handshake itself.
  # The desktop client (not a browser) can set a real Authorization
  # header on the WS upgrade request, so we reuse normal JWT validation
  # here instead of smuggling the token into a query string.
  wsAuthorizer:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsAuthorizer

  # Fires once per new websocket connection. Records connectionId + userId
  # (from the authorizer context) in the connections table.
  wsConnect:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsConnect
    events:
      - websocket:
          route: $connect
          authorizer:
            name: wsAuthorizer
            identitySource:
              - route.request.header.Authorization

  # Fires when a connection closes. Deletes the connection record and
  # any subscription records for it.
  wsDisconnect:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsDisconnect
    events:
      - websocket:
          route: $disconnect

  # Client sends {"action":"subscribe","domainType":...,"domainId":...,"entityType":...}
  # (entityType optional). Writes a subscription record for this connection.
  wsSubscribe:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsSubscribe
    events:
      - websocket:
          route: subscribe

  # Client sends {"action":"unsubscribe", ...same shape...} to remove a subscription.
  wsUnsubscribe:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsUnsubscribe
    events:
      - websocket:
          route: unsubscribe

  # Catch-all for any other message shape (e.g. client-side ping/keepalive).
  wsDefault:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsDefault
    events:
      - websocket:
          route: $default

  # Subscribed to DomainChangeTopic. On each published change event, queries
  # WebsocketConnectionsTable's GSI for subscribers matching the event's
  # domainType+domainId, filters by entityType (exact match or "*"), and
  # pushes to each via the API Gateway Management API. Deletes any connection
  # that comes back GoneException (410) as stale.
  wsNotify:
    handler: bootstrap
    environment:
      LAMBDA_ENTRYPOINT: wsNotify
    events:
      - sns:
          arn: !Ref DomainChangeTopic
          topicName: ${self:custom.domainChangeTopicName}

resources:
  Resources:
    # Single-table design. Keys use "#" as a field separator and "@FIELD" to
    # label each value, so a row's meaning is readable straight off its key:
    #   PK connectionId, SK "con"
    #     -> connection metadata (userId, connectedAt)
    #   PK connectionId, SK "sub#@DOMAINTYPE#<domainType>#@DOMAINID#<domainId>#@ENTITYTYPE#<entityType|*>"
    #     -> one subscription ("*" for entityType means "all entity types on this domain")
    #   GSI1PK "sub#@DOMAINTYPE#<domainType>#@DOMAINID#<domainId>" (entityType omitted)
    #     -> lets a broadcaster fetch every connection subscribed to a given
    #        domainType+domainId in one query, then split matches by exact
    #        entityType vs "*" in code.
    WebsocketConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.websocketConnectionsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: gsi1-domain-subscriptions
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # Fan-out point for domain-change events. api publishes here; wsNotify
    # subscribes today, a future mobile push notifier subscribes alongside it.
    # Publish with MessageAttributes domainType/domainId/entityType so future
    # subscribers can use SNS subscription filter policies to only receive
    # the event types they care about, instead of every subscriber getting
    # every message and filtering in code.
    DomainChangeTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.domainChangeTopicName}

  Outputs:
    HttpApiUrl:
      Description: Base URL for the REST API
      Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}'

    WebsocketApiUrl:
      Description: wss:// URL the desktop client connects to
      Value:
        Fn::Join:
          - ''
          - - 'wss://'
            - !Ref WebsocketsApi
            - '.execute-api.'
            - ${self:provider.region}
            - '.amazonaws.com/'
            - ${self:provider.stage}

# Package configuration
package:
  individually: false
  include:
    - bootstrap  # Include our compiled Dart executable
  exclude:
    - '**'  # Exclude everything by default
    - '!bootstrap'  # Then explicitly include only bootstrap
